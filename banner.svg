<svg width="800" height="160" viewBox="0 0 800 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="800" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#071316"/>
      <stop offset="50%" stop-color="#0d2b2e"/>
      <stop offset="100%" stop-color="#081518"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2dd4bf" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect width="800" height="160" rx="16" fill="url(#bgGrad)" stroke="#134e4a" stroke-width="1.5"/>
  <ellipse cx="400" cy="80" rx="340" ry="70" fill="url(#glow)"/>

  <!-- Subtle Floating Particles -->
  <circle cx="130" cy="42" r="2.5" fill="#2dd4bf" opacity="0.5">
    <animate attributeName="cy" values="42;30;42" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.25;0.75;0.25" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="670" cy="115" r="2.8" fill="#38bdf8" opacity="0.45">
    <animate attributeName="cy" values="115;100;115" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.7;0.2" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="540" cy="36" r="2" fill="#5eead4" opacity="0.4">
    <animate attributeName="cx" values="540;556;540" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- Handle & Display Name -->
  <text x="64" y="54" fill="#5eead4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="0.4">
    @work-aditya
  </text>
  <text x="64" y="88" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="700" letter-spacing="-0.5">
    Adieee
  </text>
  <text x="64" y="112" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">
    Frontend or full-stack engineer · Building in public
  </text>

  <!-- Stack Pills (matching your GitSkins card) -->
  <rect x="64" y="126" width="82" height="22" rx="11" fill="#0f292d" stroke="#1e4e54"/>
  <text x="105" y="141" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">JavaScript</text>

  <rect x="154" y="126" width="82" height="22" rx="11" fill="#0f292d" stroke="#1e4e54"/>
  <text x="195" y="141" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">TypeScript</text>

  <rect x="244" y="126" width="76" height="22" rx="11" fill="#0f292d" stroke="#1e4e54"/>
  <text x="282" y="141" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">PLpgSQL</text>

  <rect x="328" y="126" width="54" height="22" rx="11" fill="#0f292d" stroke="#1e4e54"/>
  <text x="355" y="141" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">CSS</text>

  <!-- Animated Bottom Glow Bar -->
  <rect x="100" y="156" width="600" height="2.5" rx="1.25" fill="url(#lineGrad)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
