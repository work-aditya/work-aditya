<svg width="1200" height="280" viewBox="0 0 1200 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Teal/Slate Gradient Background -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#071518"/>
      <stop offset="50%" stop-color="#0d2e32"/>
      <stop offset="100%" stop-color="#08181b"/>
    </linearGradient>

    <!-- Soft Ambient Radial Glow -->
    <radialGradient id="ambientGlow" cx="68%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>

    <!-- Avatar Ring Gradient -->
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>

    <!-- Bottom Glow Bar Gradient -->
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2dd4bf" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </linearGradient>

    <!-- Circular Clip Path for Profile Picture -->
    <clipPath id="avatarClip">
      <circle cx="128" cy="140" r="64"/>
    </clipPath>
  </defs>

  <!-- Full-Bleed Card Background -->
  <rect width="1200" height="280" rx="22" fill="url(#bgGrad)" stroke="#164e52" stroke-width="2"/>
  <rect width="1200" height="280" rx="22" fill="url(#ambientGlow)"/>

  <!-- Subtle Drifting Ambient Particles -->
  <circle cx="620" cy="52" r="3" fill="#2dd4bf" opacity="0.5">
    <animate attributeName="cy" values="52;36;52" dur="5.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.25;0.8;0.25" dur="5.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="940" cy="220" r="3.5" fill="#38bdf8" opacity="0.45">
    <animate attributeName="cy" values="220;198;220" dur="6.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.75;0.2" dur="6.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="790" cy="68" r="2.5" fill="#5eead4" opacity="0.45">
    <animate attributeName="cx" values="790;812;790" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- Large Profile Picture Frame (Left) -->
  <circle cx="128" cy="140" r="70" fill="#091a1d" stroke="url(#ringGrad)" stroke-width="3">
    <animate attributeName="stroke-opacity" values="0.65;1;0.65" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="128" cy="140" r="64" fill="#0f2d32"/>
  <text x="128" y="152" text-anchor="middle" fill="#5eead4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="700">A</text>

  <!-- Dynamic Avatar Target (Auto-updated by GitHub Action below) -->
  <image id="github-avatar" href="./avatar.png" x="64" y="76" width="128" height="128" preserveAspectRatio="xMidYMid slice" clip-path="url(#avatarClip)"/>

  <!-- Identity Block -->
  <text x="232" y="86" fill="#5eead4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" letter-spacing="0.4">
    @work-aditya
  </text>
  <text x="232" y="138" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="50" font-weight="700" letter-spacing="-0.8">
    Adieee
  </text>
  <text x="232" y="174" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19">
    Frontend or full-stack engineer · Building in public
  </text>

  <!-- Stack Pills -->
  <rect x="232" y="200" width="114" height="34" rx="17" fill="#0d262a" stroke="#1e4e54" stroke-width="1.2"/>
  <text x="289" y="222" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500">JavaScript</text>

  <rect x="358" y="200" width="114" height="34" rx="17" fill="#0d262a" stroke="#1e4e54" stroke-width="1.2"/>
  <text x="415" y="222" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500">TypeScript</text>

  <rect x="484" y="200" width="108" height="34" rx="17" fill="#0d262a" stroke="#1e4e54" stroke-width="1.2"/>
  <text x="538" y="222" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500">PLpgSQL</text>

  <rect x="604" y="200" width="76" height="34" rx="17" fill="#0d262a" stroke="#1e4e54" stroke-width="1.2"/>
  <text x="642" y="222" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500">CSS</text>

  <!-- Right-Side Highlight Metric -->
  <text x="1124" y="132" text-anchor="end" fill="#2dd4bf" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="700" letter-spacing="-0.6">
    65
  </text>
  <text x="1124" y="158" text-anchor="end" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" letter-spacing="1.6">
    CONTRIBUTIONS
  </text>

  <!-- Subtle Watermark -->
  <text x="1124" y="246" text-anchor="end" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
    work-aditya · showcase
  </text>

  <!-- Subtle Animated Bottom Glow Line -->
  <rect x="160" y="275" width="880" height="3" rx="1.5" fill="url(#lineGrad)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
